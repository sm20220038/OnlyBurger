org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 ships built-in Kotlin support and a new DSL. We opt out of both so the project
# uses the standard, widely-documented org.jetbrains.kotlin.* plugins and classic android {}
# DSL. (These compatibility flags exist through AGP 9.x.)
android.builtInKotlin=false
android.newDsl=false
